<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня «Зерно»</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">☕ Зерно</div>

        <button class="burger" id="burger" aria-label="Открыть меню">☰</button>

        <nav class="nav" id="nav">
            <a href="#menu">Меню</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
            <a href="#" id="navBooking">Бронь</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Кофейня «Зерно»</h1>
            <p>Свежая обжарка каждый день</p>
            <button class="btn" id="openModal">Забронировать столик</button>
        </section>
        <section id="menu" class="section">
            <h2>Меню</h2>
        </section>
        <section id="about" class="section">
            <h2>О нас</h2>
        </section>
        <section id="contacts" class="section">
            <h2>Контакты</h2>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal__window">
            <button class="modal__close" id="modalClose" aria-label="Закрыть">✕</button>

            <h2>Забронировать столик</h2>

            <form class="form" id="bookingForm">
                <input type="text" name="name" placeholder="Ваше имя" required>
                <input type="tel" name="phone" placeholder="Телефон" required>
                <input type="date" name="date" required>
                <select name="guests">
                    <option value="1">1 гость</option>
                    <option value="2" selected>2 гостя</option>
                    <option value="3">3 гостя</option>
                    <option value="4">4 и больше</option>
                </select>
                <button type="submit" class="btn">Отправить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
